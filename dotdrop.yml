actions:
  install_tty_theme: sudo cp ~/.local/share/fonts/ter-powerline-v16n.psf.gz /usr/lib/kbd/consolefonts/.
    && \ wget https://raw.githubusercontent.com/josuah/config/master/.local/bin/tty-theme
    -O ~/bin/tty-theme && \ chmod +x ~/bin/tty-theme
  install_youcompleteme: cd ~/vim/pack/start/aairey/YouCompleteMe && \  ./install.py
    --tern-completer --gocode-completer && \ cd -
config:
  backup: true
  banner: true
  create: true
  dotpath: ~/dotfiles
  ignoreempty: false
  keepdot: false
  link_dotfile_default: link
  link_on_import: link
  longkey: false
  showdiff: true
  workdir: ~/.config/dotdrop
  minversion: 1.14.2
dotfiles:
  d_fonts:
    actions:
    - install_tty_theme
    dst: ~/.local/share/fonts
    link: link_children
    src: local/share/fonts
  d_oh-my-zsh:
    dst: ~/.oh-my-zsh
    link: absolute
    src: oh-my-zsh
  d_terminator:
    dst: ~/.config/terminator
    link: link_children
    src: config/terminator
  d_vim:
    dst: ~/.vim
    link: link_children
    src: vim
  d_nvim_lua:
    dst: ~/.config/nvim/lua
    link: link_children
    src: config/nvim/lua
  f_aliases:
    dst: ~/.aliases
    link: absolute
    src: aliases
  f_bash_logout:
    dst: ~/.bash_logout
    link: absolute
    src: bash_logout
  f_bashrc:
    dst: ~/.bashrc
    link: absolute
    src: bashrc
  f_bashrc_debian:
    dst: ~/.bashrc_debian
    link: absolute
    src: bashrc_debian
  f_bugwarriorrc:
    dst: ~/.config/bugwarrior/bugwarriorrc
    link: absolute
    src: config/bugwarrior/bugwarriorrc
  f_functions:
    dst: ~/.functions
    link: absolute
    src: functions
  f_gitconfig:
    dst: ~/.gitconfig
    link: absolute
    src: gitconfig
  f_profile:
    dst: ~/.profile
    link: absolute
    src: profile
  f_timewarrior.cfg:
    dst: ~/.timewarrior/timewarrior.cfg
    link: absolute
    src: timewarrior/timewarrior.cfg
  f_tmux.conf:
    dst: ~/.tmux.conf
    link: absolute
    src: tmux.conf
  f_vimrc:
    dst: ~/.vimrc
    link: absolute
    src: vimrc
  f_zsh_plugins.txt:
    dst: ~/.zsh_plugins.txt
    link: absolute
    src: zsh_plugins.txt
  f_zshrc:
    dst: ~/.zshrc
    link: absolute
    src: zshrc
  f_nvim_init.lua:
    dst: ~/.config/nvim/init.lua
    link: absolute
    src: config/nvim/init.lua
profiles:
  base:
    dotfiles:
    - f_vimrc
    - d_vim
    - d_nvim_lua
    - f_nvim_init.lua
    - f_zshrc
    - d_oh-my-zsh
    - f_profile
    - f_aliases
    - f_functions
    - f_gitconfig
    - f_tmux.conf
    - f_zsh_plugins.txt
  osx:
    include:
    - base
  debian9:
    dotfiles:
    - f_bashrc_debian
    - f_bash_logout
    include:
    - base
  ubuntu1804:
    include:
    - debian9
  centos8:
    include:
    - base
  fedora30:
    include:
    - base
  aairey-be-le01-eu-trimblecorp-net:
    dotfiles:
    - d_fonts
    - d_terminator
    - f_bugwarriorrc
    - f_timewarrior.cfg
    include:
    - fedora30
  arsenal.home.airey.be:
    dotfiles:
    - f_bash_logout
    include:
    - fedora30
  MacBookPro.home.airey.be:
    include:
    - osx
  aairey:
    include:
    - osx
